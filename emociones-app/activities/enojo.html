<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Actividad: El volcán del enojo</title>


<style>
  :root {
    --fondo:        #FFF6EC;
    --tarjeta:      #FFFFFF;
    --texto:        #3A2A22;
    --texto-suave:  #8A7266;
    --lava:         #E24B4A;
    --lava-oscuro:  #A32D2D;
    --calma:        #1D9E75;
    --calma-suave:  #E1F5EE;
    --borde:        #F0E3D6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--fondo);
    font-family: 'Nunito', sans-serif; color: var(--texto);
    padding: 16px;
  }
  .tarjeta {
    width: 100%; max-width: 460px;
    background: var(--tarjeta);
    border-radius: 28px; border: 2px solid var(--borde);
    padding: 26px 22px 30px; text-align: center;
  }
  .titulo {
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 25px; margin: 0 0 6px;
  }
  .consigna {
    font-size: 16px; color: var(--texto-suave);
    margin: 0 0 10px; min-height: 44px; transition: color 0.3s;
  }
  .escena {
    width: 260px; height: 260px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .escena.sacudir { animation: sacudida 0.12s; }
  @keyframes sacudida {
    0%,100% { transform: translateX(0); }
    50%     { transform: translateX(4px); }
  }

  /* ----- Barra deslizante ----- */
  .nivel {
    display: flex; align-items: center; gap: 12px;
    max-width: 340px; margin: 14px auto 0;
    font-family: 'Fredoka', sans-serif; font-size: 15px; color: var(--texto-suave);
  }
  .slider {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 16px; border-radius: 999px; outline: none; cursor: pointer;
    background: linear-gradient(90deg, var(--calma), #F0C24B 55%, var(--lava));
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 5px solid var(--lava);
    box-shadow: 0 2px 6px rgba(0,0,0,0.20); cursor: pointer; transition: border-color 0.3s;
  }
  .slider::-moz-range-thumb {
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 5px solid var(--lava);
    box-shadow: 0 2px 6px rgba(0,0,0,0.20); cursor: pointer;
  }
  .slider.calma::-webkit-slider-thumb { border-color: var(--calma); }
  .slider.calma::-moz-range-thumb     { border-color: var(--calma); }
  .slider:disabled { opacity: 0.6; cursor: default; }

  /* ----- Grilla de actividades para calmarse (2da página) ----- */
  .actividades {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-top: 18px;
  }
  .actividades.visible { display: grid; }
  .opcion {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: var(--calma-suave); border: 2px solid var(--calma-suave);
    border-radius: 16px; padding: 12px 6px; cursor: pointer;
    font-family: 'Fredoka', sans-serif; color: var(--texto);
    transition: transform 0.1s, border-color 0.2s;
  }
  .opcion:hover  { border-color: var(--calma); }
  .opcion:active { transform: scale(0.95); }
  /* El recuadro con el dibujo de la acción */
  .opcion-img {
    width: 56px; height: 56px; border-radius: 12px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; line-height: 1;
  }
  .opcion-img img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
  .opcion-txt { font-size: 12px; color: var(--texto-suave); line-height: 1.15; }

  .boton {
    margin-top: 22px; font-family: 'Fredoka', sans-serif;
    font-size: 18px; font-weight: 500; color: #fff;
    background: var(--lava); border: none; border-radius: 999px;
    padding: 14px 28px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .boton:hover  { filter: brightness(0.94); }
  .boton:active { transform: scale(0.96); }
  .registro {
    margin: 16px auto 0; font-size: 13px; color: var(--texto-suave);
    font-family: 'Nunito', sans-serif;
  }
  @media (prefers-reduced-motion: reduce) {
    .escena.sacudir { animation: none; }
  }
</style>
</head>

    <div class="nivel">
      <span>calma</span>
      <input type="range" class="slider" id="slider" min="0" max="10" step="1" value="0" aria-label="Nivel de bronca">
      <span>mucha</span>
    </div>

    <!-- Las actividades se generan solas desde el código (abajo) -->
    <div class="actividades" id="actividades"></div>

    <button class="boton" id="boton">Ya saqué mi bronca</button>

    <p class="registro" id="registro">Se registra para Malen: intensidad 0/10</p>
  </div>

<script>
/* ================================================================
   CONFIGURACIÓN
   ================================================================ */
const ACTIVIDAD = {
  emocion: "enojo",
  textos: {
    inicioTitulo:   "¿Cuánta bronca tenés hoy?",
    inicioConsigna: "Movés la barrita para subir o bajar tu bronca hasta como te sentís.",
    calmaTitulo:    "Ahora vamos a calmar el volcán",
    calmaConsigna:  "Respirá y bajá la barrita. Cuando estés mejor, tocá lo que te ayudó.",
    cierreTitulo:   "¡Muy bien!",
    cierreConsigna: "Sacaste tu bronca y aprendiste a calmarla vos solo.",
    botonSacar:     "Ya saqué mi bronca"
  }
};

/* Las 10 actividades de calma para el Enojo. */
const ACCIONES_ENOJO = [
  { id: "respirar",        nombre: "Respirar hondo" },
  { id: "contar",          nombre: "Contar hasta 10" },
  { id: "tensar_soltar",   nombre: "Apretar y soltar" },
  { id: "agua",            nombre: "Tomar agua" },
  { id: "caminar",         nombre: "Salir a caminar" },
  { id: "moverme",         nombre: "Moverme un poco" },
  { id: "entender_motivo", nombre: "Entender qué pasó" },
  { id: "buscar_solucion", nombre: "Buscar una solución" },
  { id: "dibujar",         nombre: "Dibujar lo que siento" },
  { id: "musica",          nombre: "Escuchar música" }
];

/* ================================================================
   ESTADO
   ================================================================ */
const estado = {
  fase: "sacar",
  intensidad: 0,
  pico: 0,
  queLoAyudo: null
};

const el = {
  titulo:       document.getElementById("titulo"),
  consigna:     document.getElementById("consigna"),
  escena:       document.getElementById("escena"),
  reveal:       document.getElementById("reveal"),
  chispas:      document.getElementById("chispas"),
  respiracion:  document.getElementById("respiracion"),
  slider:       document.getElementById("slider"),
  actividades:  document.getElementById("actividades"),
  boton:        document.getElementById("boton"),
  registro:     document.getElementById("registro")
};

const ALTO = 560;

/* ================================================================
   FUNCIONES
   ================================================================ */
function dibujar() {
  const i = estado.intensidad;
  const alto = (i / 10) * ALTO;
  el.reveal.setAttribute("y", ALTO - alto);
  el.reveal.setAttribute("height", alto);
  el.slider.value = i;
  const etiqueta = estado.fase === "cierre" ? "Guardado para Malen" : "Se registra para Malen";
  el.registro.textContent = etiqueta + ": intensidad " + Math.round(i) + "/10";
}

function lanzarChispa() {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", 280 + (Math.random() * 120 - 60));
  c.setAttribute("cy", 230);
  c.setAttribute("r", 4 + Math.random() * 6);
  c.setAttribute("fill", "#FF8A3D");
  el.chispas.appendChild(c);
  let y = 230, op = 1;
  const t = setInterval(() => {
    y -= 5; op -= 0.06;
    c.setAttribute("cy", y);
    c.setAttribute("opacity", Math.max(0, op));
    if (op <= 0) { clearInterval(t); c.remove(); }
  }, 30);
}

function sacudir() {
  el.escena.classList.add("sacudir");
  setTimeout(() => el.escena.classList.remove("sacudir"), 120);
}

/* ------------------ LA BARRA DESLIZANTE ------------------ */
let ultimoNivel = 0;
function moverBarra() {
  if (estado.fase === "cierre") { el.slider.value = estado.intensidad; return; }
  const val = parseInt(el.slider.value, 10);
  if (val > ultimoNivel) { lanzarChispa(); sacudir(); }
  ultimoNivel = val;
  estado.intensidad = val;
  estado.pico = Math.max(estado.pico, val);
  dibujar();
}

/* Género de las ilustraciones: M/F si viene en la URL (?sex=M o ?sex=F,
   según la ficha del paciente), si no, la variante neutral. */
const GENERO = (() => {
  const g = new URLSearchParams(location.search).get('sex');
  return (g === 'M' || g === 'F') ? g : 'N';
})();

/* ------------------ ARMAR LAS ACTIVIDADES ------------------ */
function renderActividades() {
  ACCIONES_ENOJO.forEach(accion => {
    const boton = document.createElement("button");
    boton.className = "opcion";
    boton.dataset.id = accion.id;
    boton.innerHTML =
      '<span class="opcion-img"><img src="imagenes/' + accion.id + '-' + GENERO + '.png" alt=""></span>' +
      '<span class="opcion-txt">' + accion.nombre + '</span>';
    boton.addEventListener("click", () => elegirAyuda(accion.id));
    el.actividades.appendChild(boton);
  });
}

/* ------------------ FASE 2: CALMARSE ------------------ */
function empezarCalma() {
  if (estado.pico === 0) return;
  estado.fase = "calma";
  el.titulo.textContent    = ACTIVIDAD.textos.calmaTitulo;
  el.consigna.textContent  = ACTIVIDAD.textos.calmaConsigna;
  el.slider.classList.add("calma");
  el.actividades.classList.add("visible");
  el.boton.style.display   = "none";
  animarRespiracion();
}
function animarRespiracion() {
  let r = 40, creciendo = true;
  setInterval(() => {
    if (creciendo) { r += 1.8; if (r >= 110) creciendo = false; }
    else           { r -= 1.8; if (r <= 40)  creciendo = true; }
    el.respiracion.setAttribute("r", r);
  }, 40);
}

/* ------------------ FASE 3: CIERRE ------------------ */
function elegirAyuda(id) {
  if (estado.fase !== "calma") return;
  const accion = ACCIONES_ENOJO.find(a => a.id === id);
  estado.queLoAyudo = accion ? accion.nombre : id;
  estado.fase = "cierre";
  el.titulo.textContent   = ACTIVIDAD.textos.cierreTitulo;
  el.consigna.textContent = ACTIVIDAD.textos.cierreConsigna;
  el.consigna.style.color = "var(--calma)";
  el.actividades.classList.remove("visible");
  el.slider.disabled = true;

  const resultado = {
    emocion: ACTIVIDAD.emocion,
    intensidadMaxima: estado.pico,
    intensidadFinal: Math.round(estado.intensidad),
    queLoAyudo: id,                 // guardamos el id (ej: "caminar")
    queLoAyudoNombre: estado.queLoAyudo,
    reguloSolo: estado.intensidad <= 3,
    fecha: new Date().toISOString()
  };
  console.log("Resultado de la sesión:", resultado);
  if (window.parent !== window) { window.parent.postMessage(Object.assign({ type: "activity-complete" }, resultado), "*"); }
  el.registro.textContent =
    "Guardado en la ficha: llegó a " + resultado.intensidadMaxima +
    "/10 · lo ayudó " + resultado.queLoAyudoNombre.toLowerCase();
  dibujar();
}

/* ================================================================
   CONEXIONES Y ARRANQUE
   ================================================================ */
renderActividades();
el.slider.addEventListener("input", moverBarra);
el.boton.addEventListener("click", empezarCalma);

el.titulo.textContent   = ACTIVIDAD.textos.inicioTitulo;
el.consigna.textContent = ACTIVIDAD.textos.inicioConsigna;
el.boton.textContent    = ACTIVIDAD.textos.botonSacar;
dibujar();
</script>
